        <link rel="stylesheet" href="beni_style.css">
    </head>

        <div>
            <header class="top-bar">
                <h2>VIT-BANK</h2>
            </header>

        <nav>
            <a href="index.html"> Home </a>
            <a href="#about"> About Us </a>

        <div class="form-container">
            <div class="form-beni">
                <h1 class="heading"> Add benificiary </h1>
                <form>
                    <label for="beneficiaryName"> Enter Benificiary name: </label>
                    <input type="text" id="benificiaryName" name="benificiaryName"><br>
                    <label for="bankName"> Bank Name</label>
                    <input type="text" id="bankName" name="bankName"><br>
                    <label for="accountNumber"> Account Number </label>
                    <input type="number" id="accountNumber" name="accountNumber"><br>
                    <label for="confirmAccount"> Confirm Account</label>
                    <input type="number" id="confirmAccount" name="confirmAccount"><br>
                    <label for="Ifsc"> IFSC CODE: </label>
                    <input type="number" id="Ifsc" name="Ifsc"><br>
                    <label for="BranchName">Branch Name</label>
                    <input type="text" id="BranchName" name="BranchName"><br>
                    <label for="Transferlimit"> Transfer Limit: </label>
                    <input type="number" id="Transferlimit" name="Transferlimit"><br>
                    <label for="mobileNumber"> Mobile Number </label>
                    <input type="number" id="mobileNubmer" name="mobileNumber"><br>
                    <button class="submit-button"> Submit </button><br>
                </form>
            </div>
