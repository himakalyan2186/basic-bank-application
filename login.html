<!DOCTYPE html>
<html>
    <head> 
        <title> login page</title>
        <link rel="stylesheet" href="login_styles.css">
    </head>
    <body>
        <div>
            <header class="top-bar">
                <h2>VIT-BANK</h2>
            </header>
        </div>
        <nav>
            <a href="index.html"> Home </a>
            <a href="#about"> About Us </a>
            <a href="#services"> Services </a>
            <a href="#contact">Contact Us</a>
        </nav>
        <div class="login-container">
            <div class="login-box">
                <h1 class="heading"> User Login </h4>
                <forms>
                    <label for="username" class="username-label">User Name</label>
                    <input type="text" id="username" name="username"><br>
                    <label for="password"> Password</label>
                    <input type="password" id="password" name="password"><br>
                    <label for="captcha">CAPTCHA</label>
                   <div class="captcha-box">
                        A7K9P
                    </div>
                   <input type="text" id="captcha" placeholder="Enter CAPTCHA">
                   <button class="submit-button"> submit </button>
                </forms>
                <p class="forgot-pass"> forgot password</p>
                <p class="forgot-uid"> forgot userId</p>
           </div>
            <div class="hero-image">
            <img src="background_login.jpg" alt="Banking Image">
            </div>
        </div>
        <footer>
            <p>© 2026 VIT-BANK. All Rights Reserved.</p>
        </footer>
    </body>
</html>
